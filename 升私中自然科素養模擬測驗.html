<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>升私中自然科素養模擬線上測驗</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts Inter / Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-indigo-50/30 to-blue-50/50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50 shadow-xs">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-lg shadow-md shadow-indigo-200">🔬</div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold text-slate-900 tracking-tight">升私中自然科素養模擬測驗</h1>
                    <p class="text-xs text-slate-500">國小五、六年級跨領域生活情境與實驗題型</p>
                </div>
            </div>
            <div class="hidden sm:flex items-center gap-2">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-indigo-50 text-indigo-700 border border-indigo-100">
                    共 25 題精選
                </span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-3xl w-full mx-auto px-4 py-8 sm:py-12">

        <!-- Welcome / Start Screen -->
        <div id="start-screen" class="bg-white rounded-3xl shadow-xl shadow-slate-100 border border-slate-100 p-8 sm:p-12 text-center relative overflow-hidden">
            <div class="absolute -right-12 -top-12 w-48 h-48 bg-indigo-50 rounded-full blur-2xl pointer-events-none"></div>
            <div class="absolute -left-12 -bottom-12 w-48 h-48 bg-blue-50 rounded-full blur-2xl pointer-events-none"></div>

            <div class="relative z-10 max-w-xl mx-auto space-y-6">
                <div class="w-20 h-20 bg-gradient-to-tr from-indigo-600 to-violet-600 text-white rounded-3xl flex items-center justify-center mx-auto shadow-lg shadow-indigo-200 text-3xl transform hover:rotate-6 transition-transform">
                    🌟
                </div>
                <div class="space-y-2">
                    <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">頂尖私中入學模擬挑戰</h2>
                    <p class="text-slate-600 text-sm sm:text-base leading-relaxed">
                        本測驗依據私校入學命題趨勢編寫，納入大量<span class="text-indigo-600 font-bold">生活情境、實驗操作數據判讀與跨領域素養題型</span>，全方位檢測孩子的自然科學實力。
                    </p>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 text-left py-2">
                    <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                        <div class="text-xs text-slate-400 font-medium">題數總計</div>
                        <div class="text-sm font-bold text-slate-800">25 道選擇題</div>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                        <div class="text-xs text-slate-400 font-medium">測驗範圍</div>
                        <div class="text-sm font-bold text-slate-800">小五、小六全範圍</div>
                    </div>
                    <div class="col-span-2 sm:col-span-1 bg-slate-50 p-3 rounded-2xl border border-slate-100">
                        <div class="text-xs text-slate-400 font-medium">核心特色</div>
                        <div class="text-sm font-bold text-slate-800">即時解析與錯題複習</div>
                    </div>
                </div>

                <button onclick="startQuiz()" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-bold py-4 px-8 rounded-2xl transition shadow-lg shadow-indigo-200 text-base cursor-pointer">
                    立即開始測驗 🚀
                </button>
            </div>
        </div>

        <!-- Quiz Screen (Hidden by default) -->
        <div id="quiz-screen" class="hidden space-y-6">
            <!-- Progress & Header -->
            <div class="bg-white rounded-2xl p-4 sm:px-6 shadow-sm border border-slate-100 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <span class="bg-indigo-50 text-indigo-700 font-bold text-xs sm:text-sm px-3 py-1 rounded-full border border-indigo-100">
                        Q <span id="current-q-num">1</span> / 25
                    </span>
                    <span id="question-category" class="text-xs font-medium text-slate-400 bg-slate-50 px-2.5 py-1 rounded-md">生物與生態</span>
                </div>
                <div class="w-32 sm:w-48 bg-slate-100 rounded-full h-2.5 overflow-hidden">
                    <div id="progress-bar" class="bg-indigo-600 h-2.5 transition-all duration-300 rounded-full" style="width: 4%;"></div>
                </div>
            </div>

            <!-- Question Card -->
            <div class="bg-white rounded-3xl shadow-sm border border-slate-100 p-6 sm:p-10 space-y-6">
                <div id="question-text" class="text-base sm:text-lg font-bold text-slate-900 leading-relaxed">
                    載入中...
                </div>
                <div id="options-container" class="space-y-3">
                    <!-- Options injected via JS -->
                </div>
            </div>

            <!-- Navigation Controls -->
            <div class="flex justify-between items-center pt-2">
                <button id="prev-btn" onclick="prevQuestion()" class="px-6 py-3 rounded-2xl border border-slate-200 text-slate-600 hover:bg-slate-100 font-medium text-sm transition disabled:opacity-30 disabled:cursor-not-allowed bg-white shadow-xs cursor-pointer">
                    上一題
                </button>
                <button id="next-btn" onclick="nextQuestion()" class="px-8 py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm transition shadow-md shadow-indigo-200 cursor-pointer">
                    下一題
                </button>
            </div>
        </div>

        <!-- Result Screen (Hidden by default) -->
        <div id="result-screen" class="hidden space-y-6">
            <!-- Score Summary Card -->
            <div class="bg-white rounded-3xl shadow-xl shadow-slate-100 border border-slate-100 p-8 sm:p-10 text-center relative overflow-hidden">
                <div class="w-20 h-20 bg-emerald-50 text-emerald-600 rounded-3xl flex items-center justify-center mx-auto mb-4 text-3xl shadow-lg shadow-emerald-100">🏆</div>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-1">測驗圓滿完成！</h2>
                <p class="text-sm text-slate-500 mb-6">以下是您的升私中自然素養模擬測驗成績</p>
                
                <div class="inline-block bg-gradient-to-b from-slate-50 to-indigo-50/50 border border-slate-100 px-10 py-6 rounded-3xl mb-8 shadow-inner">
                    <div class="text-xs text-slate-400 font-semibold uppercase tracking-wider mb-1">百分制總分</div>
                    <div class="text-5xl sm:text-6xl font-black text-indigo-600"><span id="final-score">0</span> <span class="text-2xl font-normal text-slate-400">分</span></div>
                </div>

                <div class="flex flex-wrap justify-center gap-4">
                    <button onclick="restartQuiz()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-8 rounded-2xl transition shadow-lg shadow-indigo-200 text-sm cursor-pointer">
                        重新測驗 🔄
                    </button>
                </div>
            </div>

            <!-- Wrong Answer Analysis Card -->
            <div class="bg-white rounded-3xl shadow-xl shadow-slate-100 border border-slate-100 p-6 sm:p-10 space-y-6">
                <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                    <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                        <span>📋</span> 錯題解析與觀念補強
                    </h3>
                    <span id="wrong-count-badge" class="text-xs font-semibold px-3 py-1 rounded-full bg-slate-100 text-slate-600">錯題數：0 題</span>
                </div>
                <div id="analysis-container" class="space-y-4">
                    <!-- Analysis injected via JS -->
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-400">
        升私中自然素養線上模擬系統 &copy; 2026
    </footer>

    <!-- Quiz Data & Logic Script -->
    <script>
        const questions = [
            {
                id: 1,
                category: "生物與生態 (生活情境)",
                question: "【素養題】小明在菜園觀察到高麗菜葉片上有許多小菜蛾的幼蟲啃食，同時他也發現了好幾隻瓢蟲在葉面上爬行。如果我們要描繪這座菜園中的「生物群集」與「食物網」，下列敘述何者正確？",
                options: [
                    "高麗菜是消費者，小菜蛾是生產者",
                    "瓢蟲屬於捕食者，會吃小菜蛾幼蟲，兩者構成掠食關係",
                    "只要把菜園裡的昆蟲全部殺光，高麗菜的生長一定會變得最好且生態永續",
                    "陽光與土壤屬於生物群集的一部分"
                ],
                answer: 1,
                analysis: "高麗菜為生產者，小菜蛾幼蟲為初級消費者（草食），瓢蟲為次級消費者（肉食），會捕食小菜蛾幼蟲。陽光與土壤屬於『非生物環境』，不屬於生物群集。生物多樣性對於生態平衡相當重要，並非全數殺光最好。"
            },
            {
                id: 2,
                category: "理化與實驗 (數據判讀)",
                question: "【素養題】小華進行「固體溶解度與溫度關係」實驗，在 20℃ 與 60℃ 時分別測試某物質在 100 毫升水中的最大溶解量。實驗記錄顯示 20℃ 時可溶解 35 克，60℃ 時可溶解 85 克。若他在 60℃ 的水中加入 100 克該物質，攪拌後過濾，再將此飽和溶液從 60℃ 冷卻降溫至 20℃。請問降溫過程中會有多少克溶質沉澱出來？",
                options: [
                    "35 克",
                    "50 克",
                    "65 克",
                    "85 克"
                ],
                answer: 1,
                analysis: "在 60℃ 時最多可溶解 85 克（加入 100 克會完全溶解 85 克，剩 15 克未溶解）。當溫度從 60℃ 降到 20℃ 時，20℃ 的溶解度為 35 克，因此析出量 = 60℃溶解量 (85) - 20℃溶解量 (35) = 50 克。"
            },
            {
                id: 3,
                category: "地球科學 (生活應用)",
                question: "【素養題】台灣位於板塊交界帶，地震頻繁。當氣象署發布強震即時警報時，通常會提醒民眾採取「趴下、掩護、穩住」的保命三步驟。請問台灣之所以地震頻繁，主要是因為哪兩個板塊相互碰撞擠壓？",
                options: [
                    "歐亞大陸板塊與太平洋板塊",
                    "菲律賓海板塊與歐亞大陸板塊",
                    "印澳板塊與美洲板塊",
                    "非洲板塊與南極洲板塊"
                ],
                answer: 1,
                analysis: "台灣地處『菲律賓海板塊』與『歐亞大陸板塊』的交界帶，兩個板塊持續相互擠壓碰撞，累積龐大能量，因此地震頻繁、多山岳。"
            },
            {
                id: 4,
                category: "生物與構造 (跨領域應用)",
                question: "【素養題】近年來「仿生學（Biomimetics）」非常熱門，科學家觀察到『蒼蠅』的複眼結構，研發出能全方位監控的微型相機；又觀察到『蓮葉』表面的奈米微結構具有超強疏水與自潔能力。請問下列關於蓮葉效應的敘述，何者正確？",
                options: [
                    "水滴在蓮葉表面會展現極佳的展延性並完全浸潤葉面",
                    "蓮葉表面容易沾染灰塵，需要人工定時擦拭才能保持乾淨",
                    "水滴在蓮葉表面會形成近乎球狀的水珠，滾動時可順便帶走灰塵達到自潔效果",
                    "蓮葉表面具有強力黏膠，能把所有落塵黏住"
                ],
                answer: 2,
                analysis: "蓮葉表面佈滿微小的乳突及蠟質，水滴在上面因表面張力形成圓滾滾的水珠，當水珠滾動時會把葉面上的灰塵雜質一併帶走，這就是著名的「蓮葉效應（自潔能力）」。"
            },
            {
                id: 5,
                category: "理化與力學 (實驗操作)",
                question: "【素養題】小明在進行「槓桿原理」實驗時，在槓桿左側距離支點 15 公分處掛了 4 個砝碼（每個 10 克）。若他想在右側距離支點 20 公分處懸掛砝碼使槓桿達到水平平衡，請問右側應該掛幾個相同的砝碼？",
                options: [
                    "2 個",
                    "3 個",
                    "4 個",
                    "5 個"
                ],
                answer: 1,
                analysis: "根據槓桿平衡原理：『施力 × 施力臂 = 抗力 × 抗力臂』。左側：4個砝碼 × 15公分 = 60（力矩單位）；右側：? 個砝碼 × 20公分 = 60，因此右側需掛 60 ÷ 20 = 3 個砝碼。"
            },
            {
                id: 6,
                category: "地球科學 (天體運行)",
                question: "【素養題】小華在暑假期間到天文館參加觀星營隊，講師在解說月相時提到：「農曆每月的初八稱為上弦月，農曆十五稱為滿月。」請問當我們在農曆二十三左右的清晨（天亮前）面向南方天空觀察月亮時，最常看見下列哪一種月相？",
                options: [

                answer: 2,
                analysis: "農曆二十三左右為『下弦月』，特徵是半個月亮，亮部在左半邊（朝東半天空），通常在半夜升起、清晨位於南方天空。"
            },
            {
                id: 7,
                category: "生物與環境 (生態保育)",
                question: "【素養題】外來種「綠鬣蜥」近年在台灣南部野外大量繁殖，對本土農作物及生態造成嚴重威脅。從生態學的角度來看，下列關於外來種造成危害的原因分析，何者最合理？",
                options: [
                    "外來種來到新環境後，通常缺乏天敵的控制，且適應力強，導致族群迅速擴張",
                    "外來種會主動轉變成植物，增加生產者數量",
                    "外來種進入生態系後會自動減少繁殖，與原生種和平共處",
                    "外來種會替本土物種進行基因改良"
                ],
                answer: 0,
                analysis: "外來入侵種之所以造成嚴重危害，主要是因為牠們在新的棲地中『缺乏天敵』抑制，且排擠原生種的生存空間與食物資源，導致族群數量失控。"
            },
            {
                id: 8,
                category: "理化與水溶液 (生活情境)",
                question: "【素養題】媽媽在廚房準備晚餐時，不小心將整盤切好的洋蔥接觸到砧板上的檸檬汁，發現有些金屬器具沾到後產生了微弱的腐蝕。小明用石蕊試紙進行檢測，發現檸檬汁會使藍色石蕊試紙變紅色。下列關於檸檬汁水溶液的敘述，何者正確？",
                options: [

                    "屬於中性水溶液，可用來滴定食鹽",
                    "會使紅色石蕊試紙變成藍色"
                ],
                answer: 1,
                analysis: "檸檬汁含有檸檬酸，屬於酸性水溶液，其 pH 值小於 7，會使藍色石蕊試紙變紅色。"
            },
            {

                question: "【素養題】當我們在運動場上跑步時，呼吸頻率會不由自主地加快、心跳也會加速。關於人體呼吸與循環系統的協同運作，下列敘述何者正確？",

                    "心跳加速是因為胃部蠕動過快引起的",
                    "吸氣時，橫膈膜會向上突起，胸腔體積變大",
                    "人體吸收氧氣的主要器官是大腸"

                answer: 0,
                analysis: "運動時細胞對氧氣需求大增，代謝產生的二氧化碳增加，刺激腦部加快呼吸與心跳以加速氣體交換。吸氣時橫膈膜會『下降』使胸腔體積變大；氧氣主要在小腸被養分吸收、肺部進行氣體交換。"
            },
            {

                category: "理化與熱現象 (生活應用)",
                question: "【素養題】夏天時，我們走在戶外的柏油路上會覺得非常燙腳，而站在旁邊的草地上則感覺相對涼爽。這種現象主要牽涉到熱的傳播方式，下列敘述何者正確？",
                options: [
                    "柏油路吸熱快且溫度高，主要是透過熱傳導與熱輻射將熱量傳給腳底",
                    "草地涼爽是因為草地完全不會吸收太陽光熱能",
                    "陽光從太陽傳到地球表面主要是透過「熱對流」",

                answer: 0,

                options: [

                    "颱風一旦登陸台灣山脈後，因為水氣補給充足，威力通常會變得更強大",

        let currentQuestionIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);

        function startQuiz() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[currentQuestionIndex];
            document.getElementById('current-q-num').textContent = currentQuestionIndex + 1;
            document.getElementById('question-category').textContent = q.category;
            
            // Progress bar
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';

            document.getElementById('question-text').textContent = `${currentQuestionIndex + 1}. ${q.question}`;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const isSelected = userAnswers[currentQuestionIndex] === idx;
                const btnClass = isSelected 
                    ? 'border-indigo-600 bg-indigo-50/80 text-indigo-950 font-semibold shadow-xs ring-2 ring-indigo-500/20' 
                    : 'border-slate-200 hover:border-slate-300 hover:bg-slate-50/50 text-slate-700 bg-white';

                const button = document.createElement('button');
                button.className = `w-full text-left p-4 sm:p-4.5 rounded-2xl border transition-all flex items-start gap-3.5 cursor-pointer text-sm sm:text-base ${btnClass}`;
                button.innerHTML = `
                    <span class="w-6 h-6 shrink-0 rounded-full border border-slate-300 flex items-center justify-center text-xs font-bold ${isSelected ? 'border-indigo-600 bg-indigo-600 text-white' : 'text-slate-500 bg-slate-50'}">${String.fromCharCode(65 + idx)}</span>
                    <span class="leading-relaxed pt-0.5">${opt}</span>
                `;
                button.onclick = () => selectOption(idx);
                optionsContainer.appendChild(button);
            });

            // Buttons state
            document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;
            const nextBtn = document.getElementById('next-btn');
            if (currentQuestionIndex === questions.length - 1) {
                nextBtn.textContent = '交卷看成績 ✨';
                nextBtn.className = 'px-8 py-3 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold text-sm transition shadow-md shadow-emerald-200 cursor-pointer';
            } else {
                nextBtn.textContent = '下一題';
                nextBtn.className = 'px-8 py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm transition shadow-md shadow-indigo-200 cursor-pointer';
            }
        }

        function selectOption(optionIndex) {
            userAnswers[currentQuestionIndex] = optionIndex;
            loadQuestion();
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                submitQuiz();
            }
        }

        function submitQuiz() {
            // Calculate score
            let correctCount = 0;
            questions.forEach((q, idx) => {
                if (userAnswers[idx] === q.answer) {
                    correctCount++;
                }
            });

            const score = Math.round((correctCount / questions.length) * 100);

            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('final-score').textContent = score;

            // Generate Analysis
            const analysisContainer = document.getElementById('analysis-container');
            analysisContainer.innerHTML = '';

            let wrongCount = 0;
            questions.forEach((q, idx) => {
                const userAns = userAnswers[idx];
                const isCorrect = userAns === q.answer;

                if (!isCorrect) {
                    wrongCount++;
                    const userText = userAns !== null ? `${String.fromCharCode(65 + userAns)}. ${q.options[userAns]}` : '未作答';
                    const correctText = `${String.fromCharCode(65 + q.answer)}. ${q.options[q.answer]}`;

                    const div = document.createElement('div');
                    div.className = 'p-5 rounded-2xl border border-rose-100 bg-rose-50/40 space-y-3';
                    div.innerHTML = `
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-rose-600 bg-rose-100/80 px-2.5 py-1 rounded-md">第 ${idx + 1} 題</span>
                            <span class="text-xs text-slate-400">${q.category}</span>
                        </div>
                        <div class="text-sm font-bold text-slate-900 leading-relaxed">${q.question}</div>
                        <div class="text-xs sm:text-sm space-y-1.5 pt-1 border-t border-rose-100/60">
                            <div class="text-rose-600 font-medium">❌ 您的回答：${userText}</div>
                            <div class="text-emerald-700 font-medium">✔️ 正確答案：${correctText}</div>
                            <div class="text-slate-600 mt-2 bg-white/80 p-3.5 rounded-xl border border-slate-100 leading-relaxed">
                                💡 <strong>素養觀念解析：</strong>${q.analysis}
                            </div>
                        </div>
                    `;
                    analysisContainer.appendChild(div);
                }
            });

            document.getElementById('wrong-count-badge').textContent = `錯題數：${wrongCount} 題`;

            if (wrongCount === 0) {
                analysisContainer.innerHTML = `
                    <div class="p-8 text-center bg-emerald-50 text-emerald-800 rounded-2xl border border-emerald-100 font-medium space-y-2">
                        <div class="text-2xl">🎉</div>
                        <div class="font-bold text-base">太強了！ 25 題全數答對！</div>
                        <p class="text-xs text-emerald-600">您在自然科學與素養題型上具備頂尖實力，應試私中絕對金榜題名！</p>
                    </div>
                `;
            }
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            userAnswers = new Array(questions.length).fill(null);
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
